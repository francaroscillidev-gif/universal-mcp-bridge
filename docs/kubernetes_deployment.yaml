apiVersion: apps/v1
kind: Deployment
metadata:
  name: universal-mcp-bridge
  labels:
    app: universal-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: universal-mcp
  template:
    metadata:
      labels:
        app: universal-mcp
    spec:
      containers:
      - name: gateway
        image: ghcr.io/francaroscillidev-gif/universal-mcp-bridge:latest
        command: ["universal-mcp", "serve", "--config", "/etc/mcp/config.yaml", "--transport", "sse", "--port", "8080"]
        ports:
        - containerPort: 8080
          name: mcp-sse
        - containerPort: 8000
          name: dashboard
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: universal-mcp-service
spec:
  selector:
    app: universal-mcp
  ports:
  - name: sse
    port: 8080
    targetPort: 8080
  - name: dashboard
    port: 8000
    targetPort: 8000
  type: ClusterIP
