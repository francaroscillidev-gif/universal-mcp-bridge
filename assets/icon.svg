<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Metallic & Neon Gradients -->
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="neonAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#bridgeGrad)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Background Cyber Circuit Grid Lines -->
  <g opacity="0.18" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 8">
    <line x1="80" y1="120" x2="432" y2="120" />
    <line x1="80" y1="256" x2="432" y2="256" />
    <line x1="80" y1="392" x2="432" y2="392" />
    <line x1="140" y1="80" x2="140" y2="432" />
    <line x1="256" y1="80" x2="256" y2="432" />
    <line x1="372" y1="80" x2="372" y2="432" />
  </g>

  <!-- Hexagonal Security Shield in background -->
  <polygon points="256,90 380,150 380,290 256,380 132,290 132,150" 
           fill="url(#shieldGrad)" 
           stroke="#4f46e5" 
           stroke-width="2.5" 
           stroke-opacity="0.5" />

  <!-- Universal Bridge Arches (Dual Gateway Bridges) -->
  <g filter="url(#glow)">
    <!-- Lower suspension bridge arch -->
    <path d="M 110 330 C 180 375, 332 375, 402 330" 
          fill="none" 
          stroke="url(#bridgeGrad)" 
          stroke-width="10" 
          stroke-linecap="round" />

    <!-- Upper bridge suspension cable -->
    <path d="M 120 210 Q 256 310 392 210" 
          fill="none" 
          stroke="url(#neonCyan)" 
          stroke-width="4.5" 
          stroke-linecap="round" />

    <!-- Vertical suspension bridge cables -->
    <line x1="170" y1="245" x2="170" y2="340" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
    <line x1="210" y1="272" x2="210" y2="352" stroke="#6366f1" stroke-width="2" opacity="0.6" />
    <line x1="256" y1="285" x2="256" y2="356" stroke="#818cf8" stroke-width="2.5" opacity="0.8" />
    <line x1="302" y1="272" x2="302" y2="352" stroke="#6366f1" stroke-width="2" opacity="0.6" />
    <line x1="342" y1="245" x2="342" y2="340" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
  </g>

  <!-- Left Gateway Pillar (Classic Tools: CLI/DB/REST) -->
  <g>
    <rect x="110" y="160" width="22" height="180" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
    <circle cx="121" cy="190" r="4" fill="#38bdf8" />
    <circle cx="121" cy="220" r="4" fill="#38bdf8" />
    <circle cx="121" cy="250" r="4" fill="#38bdf8" />
    <circle cx="121" cy="280" r="4" fill="#38bdf8" />
    <!-- Pulse ring on top -->
    <circle cx="121" cy="150" r="8" fill="#0284c7" />
    <circle cx="121" cy="150" r="4" fill="#38bdf8" filter="url(#glow)" />
  </g>

  <!-- Right Gateway Pillar (AI Agents / LLMs) -->
  <g>
    <rect x="380" y="160" width="22" height="180" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="3" />
    <circle cx="391" cy="190" r="4" fill="#c084fc" />
    <circle cx="391" cy="220" r="4" fill="#c084fc" />
    <circle cx="391" cy="250" r="4" fill="#c084fc" />
    <circle cx="391" cy="280" r="4" fill="#c084fc" />
    <!-- Pulse ring on top -->
    <circle cx="391" cy="150" r="8" fill="#7e22ce" />
    <circle cx="391" cy="150" r="4" fill="#c084fc" filter="url(#glow)" />
  </g>

  <!-- Center Core: Neural Nexus & MCP Protocol Fusion -->
  <g filter="url(#softGlow)">
    <circle cx="256" cy="216" r="38" fill="#0f172a" stroke="url(#bridgeGrad)" stroke-width="4" />
  </g>
  <circle cx="256" cy="216" r="26" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
  
  <!-- Central Dynamic Lightning / Protocol Bolt -->
  <polygon points="259,188 243,218 257,218 253,244 271,212 257,212" 
           fill="url(#neonAmber)" 
           filter="url(#glow)" />

  <!-- Orbiting Connectivity Nodes (Universal Adapters) -->
  <!-- Top Node (API / REST / GraphQL) -->
  <circle cx="256" cy="120" r="9" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="256" cy="120" r="4" fill="#38bdf8" />
  <line x1="256" y1="130" x2="256" y2="176" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.8" />

  <!-- Bottom-Left Node (Databases: SQLite / Postgres / Redis) -->
  <circle cx="180" cy="390" r="9" fill="#0f172a" stroke="#10b981" stroke-width="2.5" />
  <circle cx="180" cy="390" r="4" fill="#10b981" />
  <line x1="192" y1="375" x2="236" y2="330" stroke="#10b981" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.8" />

  <!-- Bottom-Right Node (Scripts / CLI / Bash / Python) -->
  <circle cx="332" cy="390" r="9" fill="#0f172a" stroke="#f43f5e" stroke-width="2.5" />
  <circle cx="332" cy="390" r="4" fill="#f43f5e" />
  <line x1="320" y1="375" x2="276" y2="330" stroke="#f43f5e" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.8" />

  <!-- Brand Signature / Badge Typography -->
  <text x="256" y="446" 
        text-anchor="middle" 
        fill="#f8fafc" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" 
        font-size="22" 
        letter-spacing="5">UNIVERSAL MCP</text>

  <text x="256" y="468" 
        text-anchor="middle" 
        fill="#94a3b8" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="600" 
        font-size="11" 
        letter-spacing="3">BRIDGE &amp; PROXY GATEWAY</text>
</svg>
