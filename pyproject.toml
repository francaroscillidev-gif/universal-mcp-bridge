[project]
name = "universal-mcp-bridge"
version = "0.1.0"
description = "Universal MCP (Model Context Protocol) Bridge & Proxy: turn OpenAPI, scripts, CLIs & databases into MCP servers on the fly."
readme = "README.md"
authors = [
    { name = "franca roscilli", email = "francaroscillidev@gmail.com" }
]
urls = { "Homepage" = "https://github.com/francaroscillidev-gif", "Repository" = "https://github.com/francaroscillidev-gif/universal-mcp-bridge" }

requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.32.0",
    "click>=8.5.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mcp>=1.0.0",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-mock>=3.17.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "rich>=15.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
universal-mcp = "universal_mcp.cli:cli"


[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
